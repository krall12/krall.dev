<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Benjamin Krall</title>
    <meta
      name="description"
      content="I unstick live React and Node products. Two weeks of nights and weekends. One shipped slice. $3,000."
    />
    <link rel="canonical" href="https://krall.dev/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#fafaf9" />
    <style>
      :root {
        --ink: #1c1917;
        --paper: #fafaf9;
        --muted: #44403c;
      }
      html {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--paper);
        color: var(--ink);
        font: 18px/1.5 ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 4.5rem 1.25rem 5rem;
      }
      h1 {
        margin: 0 0 1.5rem;
        font: 600 1.5rem/1.25 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        max-width: 32rem;
        color: var(--muted);
      }
      .lede {
        color: var(--ink);
        font-size: 1.125rem;
      }
      a {
        color: var(--ink);
        text-underline-offset: 0.18em;
      }
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      @media (min-width: 640px) {
        main {
          padding: 7rem 2rem 8rem;
        }
        h1 {
          font-size: 1.75rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Benjamin Krall</h1>
      <p class="lede">I unstick live React and Node products.</p>
      <p>
        Two weeks of nights and weekends. One shipped slice. $3,000. 20-minute
        call first. I'll tell you if it isn't a fit.
      </p>
      <p>Orlando or remote.</p>
      <p><a href="mailto:hi@krall.dev">hi@krall.dev</a></p>
    </main>
  </body>
</html>
